<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">PolyAnalyst approval lifecycle</title>
  <desc id="desc">A run moves from plan approval to execution, with a pre-execution human approval for high-risk queries.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
  <rect width="1200" height="470" rx="24" fill="#fff7ed"/>
  <text x="60" y="62" fill="#431407" font-family="Arial, sans-serif" font-size="30" font-weight="700">Approval lifecycle</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="70" y="170" width="205" height="95" rx="18" fill="#2563eb"/><text x="172" y="210" fill="white" font-size="19" font-weight="700">PLAN REVIEW</text><text x="172" y="238" fill="#dbeafe" font-size="14">User edits or approves</text>
    <rect x="335" y="170" width="205" height="95" rx="18" fill="#d97706"/><text x="437" y="210" fill="white" font-size="19" font-weight="700">RISK GATE</text><text x="437" y="238" fill="#fef3c7" font-size="14">Only for high risk</text>
    <rect x="600" y="170" width="205" height="95" rx="18" fill="#7c3aed"/><text x="702" y="210" fill="white" font-size="19" font-weight="700">EXECUTION</text><text x="702" y="238" fill="#ede9fe" font-size="14">Agents + evidence</text>
    <rect x="865" y="170" width="260" height="95" rx="18" fill="#16a34a"/><text x="995" y="210" fill="white" font-size="19" font-weight="700">REVIEW + EXPORT</text><text x="995" y="238" fill="#dcfce7" font-size="14">Approve, revise, or fail</text>
  </g>
  <g fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"><path d="M280 218 H325"/><path d="M545 218 H590"/><path d="M810 218 H855"/></g>
  <path d="M437 280 C437 370 702 370 702 280" fill="none" stroke="#be123c" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
  <text x="570" y="410" text-anchor="middle" fill="#9f1239" font-family="Arial, sans-serif" font-size="15">No web search, private retrieval, data access, or LLM call occurs before high-risk approval.</text>
</svg>
