<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">PolyAnalyst architecture overview</title>
  <desc id="desc">A user question flows through the supervisor and approval gates to specialist agents, the evidence store, reviewer, and final report.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#0f172a"/><stop offset="1" stop-color="#172554"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#93c5fd"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-opacity=".25"/></filter>
  </defs>
  <rect width="1400" height="760" rx="28" fill="url(#bg)"/>
  <text x="70" y="72" fill="#f8fafc" font-family="Arial, sans-serif" font-size="34" font-weight="700">PolyAnalyst</text>
  <text x="70" y="108" fill="#bfdbfe" font-family="Arial, sans-serif" font-size="18">Evidence-centric multi-agent research platform</text>
  <g font-family="Arial, sans-serif" filter="url(#shadow)">
    <rect x="70" y="190" width="220" height="112" rx="18" fill="#2563eb"/>
    <text x="180" y="235" text-anchor="middle" fill="white" font-size="21" font-weight="700">Researcher</text>
    <text x="180" y="266" text-anchor="middle" fill="#dbeafe" font-size="15">Question, scope, files</text>

    <rect x="380" y="170" width="250" height="150" rx="18" fill="#7c3aed"/>
    <text x="505" y="218" text-anchor="middle" fill="white" font-size="21" font-weight="700">Supervisor</text>
    <text x="505" y="247" text-anchor="middle" fill="#ede9fe" font-size="15">Clarify + plan DAG</text>
    <text x="505" y="274" text-anchor="middle" fill="#ede9fe" font-size="15">Budget + risk policy</text>

    <rect x="730" y="190" width="220" height="112" rx="18" fill="#d97706"/>
    <text x="840" y="235" text-anchor="middle" fill="white" font-size="21" font-weight="700">Approval gate</text>
    <text x="840" y="266" text-anchor="middle" fill="#fef3c7" font-size="15">Plan + high-risk HITL</text>

    <rect x="1030" y="145" width="280" height="210" rx="18" fill="#334155"/>
    <text x="1170" y="184" text-anchor="middle" fill="white" font-size="20" font-weight="700">Specialist agents</text>
    <text x="1060" y="220" fill="#cbd5e1" font-size="15">Research • RAG • Data</text>
    <text x="1060" y="250" fill="#cbd5e1" font-size="15">Critic • Reporter • Reviewer</text>
    <text x="1060" y="296" fill="#93c5fd" font-size="14">Independent tasks run in parallel</text>

    <rect x="245" y="480" width="300" height="140" rx="18" fill="#0f766e"/>
    <text x="395" y="528" text-anchor="middle" fill="white" font-size="21" font-weight="700">Evidence Store</text>
    <text x="395" y="558" text-anchor="middle" fill="#ccfbf1" font-size="15">Sources • claims • excerpts</text>
    <text x="395" y="585" text-anchor="middle" fill="#ccfbf1" font-size="15">Quality • freshness • provenance</text>

    <rect x="680" y="480" width="250" height="140" rx="18" fill="#be123c"/>
    <text x="805" y="528" text-anchor="middle" fill="white" font-size="21" font-weight="700">Critique + review</text>
    <text x="805" y="558" text-anchor="middle" fill="#ffe4e6" font-size="15">Contradictions + citations</text>
    <text x="805" y="585" text-anchor="middle" fill="#ffe4e6" font-size="15">Revision or abstention</text>

    <rect x="1060" y="480" width="250" height="140" rx="18" fill="#16a34a"/>
    <text x="1185" y="528" text-anchor="middle" fill="white" font-size="21" font-weight="700">Final report</text>
    <text x="1185" y="558" text-anchor="middle" fill="#dcfce7" font-size="15">Readable citations + appendix</text>
    <text x="1185" y="585" text-anchor="middle" fill="#dcfce7" font-size="15">Markdown / PDF / UI</text>
  </g>
  <g fill="none" stroke="#93c5fd" stroke-width="4" marker-end="url(#arrow)">
    <path d="M290 246 H372"/><path d="M636 246 H722"/><path d="M956 246 H1022"/>
    <path d="M1170 365 V438 H395 V472"/><path d="M545 550 H670"/><path d="M938 550 H1050"/>
    <path d="M805 472 V405 H630 V300"/>
  </g>
  <text x="70" y="700" fill="#bfdbfe" font-family="Arial, sans-serif" font-size="15">Every final claim points back to evidence; retrieved text remains untrusted data.</text>
</svg>
